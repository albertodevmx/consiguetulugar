<h2>Tipos de examen</h2>

<form (ngSubmit)="add()" class="row g-2 mb-4">
  <div class="col-auto">
    <input
      type="text"
      class="form-control"
      [(ngModel)]="name"
      name="name"
      placeholder="Nombre del tipo de examen"
      required
    />
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">Agregar</button>
  </div>
</form>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Slug</th>
      <th>Activo</th>
      <th style="width: 180px">Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (item of examTypes$ | async; track item.id) {
      <tr>
        <td>
          @if (editingId() === item.id) {
            <input
              type="text"
              class="form-control form-control-sm"
              [ngModel]="editingName()"
              (ngModelChange)="editingName.set($event)"
              [ngModelOptions]="{ standalone: true }"
            />
          } @else {
            {{ item.name }}
          }
        </td>
        <td>{{ item.slug }}</td>
        <td>{{ item.active ? 'Si' : 'No' }}</td>
        <td>
          @if (editingId() === item.id) {
            <button class="btn btn-sm btn-success me-1" (click)="saveEdit(item.id!)">Guardar</button>
            <button class="btn btn-sm btn-secondary" (click)="cancelEdit()">Cancelar</button>
          } @else {
            <button class="btn btn-sm btn-outline-primary me-1" (click)="startEdit(item)">Editar</button>
            <button class="btn btn-sm btn-outline-danger" (click)="remove(item.id!)">Eliminar</button>
          }
        </td>
      </tr>
    } @empty {
      <tr><td colspan="4" class="text-center text-muted">No hay tipos de examen registrados.</td></tr>
    }
  </tbody>
</table>
