<header class="site-header">
  <a routerLink="/" class="logo">
    <img src="logo-consigue-tu-lugar.png" alt="Consigue tu lugar" class="navbar-logo">
  </a>

  <div class="header-actions">
    @if (auth.isLoggedIn()) {
      <a routerLink="/perfil" class="nav-btn nav-btn--enter"><i class="bi bi-person-circle"></i> Mi cuenta</a>
    } @else {
      <a routerLink="/login" class="nav-btn nav-btn--enter"><i class="bi bi-person"></i> Entrar</a>
    }

    <nav>
      <a [routerLink]="practiceLink()" class="nav-btn nav-btn--practice"><i class="bi bi-mortarboard"></i> Practicar</a>
    </nav>
  </div>
</header>
