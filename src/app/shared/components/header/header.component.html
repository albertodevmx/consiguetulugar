<header class="site-header">
  <a routerLink="/" class="logo">
    <img src="logo-white.png" alt="Consigue tu lugar" class="navbar-logo">
  </a>

  <div class="header-actions">
    <nav>
      <a [routerLink]="practiceLink()" class="nav-link nav-link--warning"><i class="bi bi-mortarboard"></i><span class="nav-label"> Practicar</span></a>
    </nav>

    @if (auth.isLoggedIn()) {
      <a routerLink="/perfil" class="nav-link"><i class="bi bi-person-circle"></i><span class="nav-label"> Mi cuenta</span></a>
    } @else {
      <a routerLink="/login" class="nav-link nav-link--warning"><i class="bi bi-person"></i><span class="nav-label"> Entrar</span></a>
    }
  </div>
</header>
